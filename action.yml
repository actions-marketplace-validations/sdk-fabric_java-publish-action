name: 'SDK-Fabric Java Publish'
description: 'SDK-Fabric GitHub action to publish a Java release'
branding:
  icon: 'upload'
  color: 'blue'
inputs:
  typehub_version:
    description: 'The version to set for the Maven project'
    required: true
  gpg_private_key:
    description: 'GPG Private Key content'
    required: true
  gpg_passphrase:
    description: 'GPG Key Passphrase'
    required: true
  sonatype_username:
    description: 'Sonatype Central Username / Token'
    required: true
  sonatype_password:
    description: 'Sonatype Central Password / Token'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Install Maven 3.9.9
      run: |
        MVN_VERSION="3.9.9"
        wget -q https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz
        tar -xzf apache-maven-${MVN_VERSION}-bin.tar.gz
        sudo mv apache-maven-${MVN_VERSION} /opt/maven
        echo "/opt/maven/bin" >> $GITHUB_PATH
      shell: bash
    - name: Update version
      run: mvn versions:set -DnewVersion="${{ inputs.typehub_version }}"
      shell: bash
    - name: Import GPG key
      id: import-gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}
        passphrase: ${{ inputs.gpg_passphrase }}
        trust_level: ultimate
    - name: Publish package
      run: mvn --batch-mode clean deploy -Dgpg.keyname=${{ steps.import-gpg.outputs.fingerprint }}
      shell: bash
      env:
        MAVEN_USERNAME: ${{ inputs.sonatype_username }}
        MAVEN_PASSWORD: ${{ inputs.sonatype_password }}
        GPG_PASSPHRASE: ${{ inputs.gpg_passphrase }}
